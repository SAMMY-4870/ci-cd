<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PulseRx Signup</title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="css/signup.css"
  />

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body>

  <!-- BACKGROUND -->

  <div class="bg-animation"></div>

  <div class="container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

      <img
        src="images/pulserx-logo.png"
        class="logo"
        alt="PulseRx Logo"
      />

      <h1>PulseRx 💊</h1>

      <p class="slogan">

        स्वस्थः जनः समृद्धः राष्ट्रः।<br>

        आरोग्यसेवा सर्वेषां अधिकारः।<br>

        वयं तत् साधयामः॥

      </p>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

      <div class="signup-box">

        <h2>Create Account</h2>

        <p class="sub-text">

          Join PulseRx Platform 🚀

        </p>

        <!-- FORM -->

        <form id="signupForm">

          <!-- NAME -->

          <div class="row">

            <input
              type="text"
              id="firstName"
              placeholder="First Name"
              required
            />

            <input
              type="text"
              id="lastName"
              placeholder="Last Name"
              required
            />

          </div>

          <!-- AGE -->

          <input
            type="number"
            id="age"
            placeholder="Enter Age"
            required
          />

          <!-- MOBILE -->

          <input
            type="text"
            id="mobile"
            placeholder="Enter Mobile Number"
            maxlength="10"
            required
          />

          <!-- OTP -->

          <div class="otp-section">

            <button
              type="button"
              id="sendOtpBtn"
            >

              Send OTP

            </button>

            <span id="otpTimer">

            </span>

          </div>

          <!-- OTP INPUT -->

          <input
            type="text"
            id="otp"
            placeholder="Enter OTP"
            maxlength="6"
            required
          />

          <!-- PASSWORD -->

          <div class="password-box">

            <input
              type="password"
              id="password"
              placeholder="Create Password"
              required
            />

            <i
              class="fa-solid fa-eye"
              onclick="togglePassword('password')"
            ></i>

          </div>

          <!-- PASSWORD HINT -->

          <p class="hint">

            Password must contain minimum
            8 characters 🔐

          </p>

          <!-- CONFIRM PASSWORD -->

          <div class="password-box">

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              required
            />

            <i
              class="fa-solid fa-eye"
              onclick="togglePassword('confirmPassword')"
            ></i>

          </div>

          <!-- BUTTON -->

          <button
            type="submit"
            class="signup-btn"
          >

            Create Account

          </button>

        </form>

        <!-- LOGIN -->

        <p class="login-link">

          Already have account?

          <a href="login.html">

            Login

          </a>

        </p>

      </div>

    </div>

  </div>

  <!-- FIREBASE -->

  <script
    type="module"
    src="js/firebase-config.js"
  ></script>

  <!-- JS -->

  <script src="js/signup.js"></script>

</body>

</html>
