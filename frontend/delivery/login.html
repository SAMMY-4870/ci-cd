<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>

    Delivery Login

  </title>

  <link
    rel="stylesheet"
    href="css/login.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>

<body>

<div class="container">

  <div class="login-box">

    <h1>

      🚚 Delivery Partner

    </h1>

    <p>

      Login To Continue

    </p>

    <input
      type="text"
      placeholder="Mobile Number"
      id="mobile"
    >

    <input
      type="password"
      placeholder="Password"
      id="password"
    >

    <button id="loginBtn">

      Login

    </button>

  </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
