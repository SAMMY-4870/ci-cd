<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PulseRx Order Tracking</title>

  <!-- LEAFLET -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      background:
        linear-gradient(
          135deg,
          #071028,
          #0f1f47,
          #2b1457
        );

      color:white;

      min-height:100vh;

      padding:25px;
    }

    .container{

      max-width:1100px;

      margin:auto;
    }

    h1{

      text-align:center;

      margin-bottom:30px;

      font-size:40px;
    }

    .search{

      display:flex;

      gap:15px;

      margin-bottom:30px;
    }

    input{

      flex:1;

      padding:16px;

      border:none;

      border-radius:16px;

      background:
        rgba(255,255,255,0.08);

      color:white;

      font-size:16px;

      outline:none;

      backdrop-filter:blur(10px);
    }

    input::placeholder{

      color:#cbd5e1;
    }

    button{

      border:none;

      padding:16px 24px;

      border-radius:16px;

      cursor:pointer;

      font-weight:600;

      color:white;

      background:
        linear-gradient(
          to right,
          #2563eb,
          #7c3aed
        );
    }

    .card{

      background:
        rgba(255,255,255,0.08);

      border:
        1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(14px);

      border-radius:24px;

      padding:30px;

      margin-top:20px;
    }

    .info{

      margin:14px 0;

      color:#dbeafe;

      font-size:15px;
    }

    .timeline{

      margin-top:35px;
    }

    .step{

      display:flex;

      align-items:center;

      margin-bottom:25px;
    }

    .circle{

      width:45px;
      height:45px;

      border-radius:50%;

      background:#374151;

      display:flex;

      justify-content:center;

      align-items:center;

      margin-right:20px;

      font-weight:bold;

      transition:0.3s;
    }

    .circle.active{

      background:
        linear-gradient(
          to right,
          #10b981,
          #059669
        );
    }

    .status{

      font-size:18px;

      font-weight:600;
    }

    .done{

      color:#4ade80;
    }

    .pending{

      color:#9ca3af;
    }

    .delivery-box{

      margin-top:30px;

      background:
        rgba(255,255,255,0.06);

      border-radius:20px;

      padding:25px;
    }

    .delivery-box h3{

      margin-bottom:20px;

      color:#60a5fa;
    }

    .map-container{

      margin-top:30px;

      border-radius:24px;

      overflow:hidden;
    }

    #map{

      width:100%;

      height:400px;
    }

    .call-btn{

      margin-top:20px;

      width:100%;

      padding:14px;

      border:none;

      border-radius:14px;

      background:
        linear-gradient(
          to right,
          #10b981,
          #059669
        );

      color:white;

      font-size:15px;

      font-weight:600;

      cursor:pointer;
    }

    @media(max-width:700px){

      .search{

        flex-direction:column;
      }

      h1{

        font-size:30px;
      }
    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    🚚 PulseRx Tracking
  </h1>

  <!-- SEARCH -->

  <div class="search">

    <input
      type="text"
      id="orderId"
      placeholder="Enter Order ID"
    >

    <button onclick="trackOrder()">

      Track Order

    </button>

  </div>

  <!-- RESULT -->

  <div id="result"></div>

</div>

<script>

let map;
let deliveryMarker;

// ======================================
// TRACK ORDER
// ======================================

async function trackOrder(){

  const id =
    document.getElementById(
      "orderId"
    ).value;

  if(!id){

    return alert(
      "Enter Order ID ❌"
    );
  }

  try {

    const res =
      await fetch(
        "http://localhost:5000/orders"
      );

    const result =
      await res.json();

    const order =
      result.data.find(
        o => o.id === id
      );

    if(!order){

      return document.getElementById(
        "result"
      ).innerHTML = `

        <div class="card">

          <h2>
            Order Not Found ❌
          </h2>

        </div>
      `;
    }

    const statuses = [

      "Pending",

      "Processing",

      "Out for Delivery",

      "Delivered"
    ];

    const currentIndex =
      statuses.indexOf(
        order.status
      );

    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="card">

        <h2>
          ${order.name}
        </h2>

        <div class="info">
          📱 ${order.mobile}
        </div>

        <div class="info">
          📍 ${order.address}
        </div>

        <div class="info">
          💊 ${order.medicine}
        </div>

        <div class="info">
          📦 Qty:
          ${order.quantity}
        </div>

        <div class="info">
          🚚 Status:
          ${order.status}
        </div>

        <div class="info">
          🕒 ${order.createdAt}
        </div>

        <!-- DELIVERY -->

        <div class="delivery-box">

          <h3>
            🚚 Delivery Partner
          </h3>

          <div class="info">
            👤 Rahul Patil
          </div>

          <div class="info">
            📱 +91 9876543210
          </div>

          <div class="info">
            ⏱ ETA: 20 mins
          </div>

          <button
            class="call-btn"
            onclick="
              window.location.href=
              'tel:+919876543210'
            "
          >

            Call Delivery Boy

          </button>

        </div>

        <!-- TIMELINE -->

        <div class="timeline">

          ${statuses.map((status,index)=>`

            <div class="step">

              <div class="
                circle
                ${index <= currentIndex ? 'active' : ''}
              ">

                ${index+1}

              </div>

              <div class="
                status
                ${index <= currentIndex
                  ? 'done'
                  : 'pending'}
              ">

                ${status}

              </div>

            </div>

          `).join("")}

        </div>

        <!-- MAP -->

        <div class="map-container">

          <div id="map"></div>

        </div>

      </div>
    `;

    // ======================================
    // MAP
    // ======================================

    setTimeout(()=>{

      if(map){

        map.remove();
      }

      map = L.map("map").setView(
        [19.0760,72.8777],
        13
      );

      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          attribution:
            "&copy; OpenStreetMap"
        }

      ).addTo(map);

      // USER

      L.marker(
        [19.0760,72.8777]
      )

      .addTo(map)

      .bindPopup(
        "📍 User Location"
      );

      // DELIVERY

      deliveryMarker = L.marker(
        [19.0860,72.8877]
      )

      .addTo(map)

      .bindPopup(
        "🚚 Delivery Boy"
      );

      // LIVE MOVEMENT

      let lat = 19.0860;
      let lng = 72.8877;

      setInterval(()=>{

        lat -= 0.0005;
        lng -= 0.0005;

        deliveryMarker.setLatLng(
          [lat,lng]
        );

      },2000);

    },300);

  } catch(error){

    console.error(error);

    alert(
      "Tracking Failed ❌"
    );
  }
}

</script>

</body>
</html>
