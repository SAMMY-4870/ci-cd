<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CloudShip Analytics</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#f4f7fb;
      padding:20px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    h1{
      color:#333;
    }

    .logout{
      background:red;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
    }

    .cards{
      display:grid;
      grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

      gap:20px;

      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .card h2{
      margin-top:10px;
      color:#007bff;
      font-size:30px;
    }

    .charts{
      display:grid;

      grid-template-columns:
        repeat(auto-fit,minmax(400px,1fr));

      gap:25px;
    }

    .chart-box{
      background:white;
      padding:20px;
      border-radius:18px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    canvas{
      width:100% !important;
      height:350px !important;
    }

    .recent{
      margin-top:30px;

      background:white;

      padding:20px;

      border-radius:18px;

      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    table th,
    table td{
      padding:12px;
      border-bottom:1px solid #ddd;
      text-align:left;
    }

    .pending{
      color:orange;
      font-weight:bold;
    }

    .delivered{
      color:green;
      font-weight:bold;
    }

  </style>
</head>

<body>

<div class="topbar">

  <h1>📊 CloudShip Analytics</h1>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>

<!-- ================= CARDS ================= -->

<div class="cards">

  <div class="card">
    <p>📦 Total Orders</p>
    <h2 id="totalOrders">0</h2>
  </div>

  <div class="card">
    <p>💰 Revenue</p>
    <h2 id="revenue">₹0</h2>
  </div>

  <div class="card">
    <p>🚚 Delivered</p>
    <h2 id="delivered">0</h2>
  </div>

  <div class="card">
    <p>⏳ Pending</p>
    <h2 id="pending">0</h2>
  </div>

</div>

<!-- ================= CHARTS ================= -->

<div class="charts">

  <div class="chart-box">
    <h3>📈 Revenue Analytics</h3>
    <canvas id="revenueChart"></canvas>
  </div>

  <div class="chart-box">
    <h3>📦 Order Status</h3>
    <canvas id="statusChart"></canvas>
  </div>

</div>

<!-- ================= RECENT ORDERS ================= -->

<div class="recent">

  <h3>🕒 Recent Orders</h3>

  <table>

    <thead>

      <tr>
        <th>Name</th>
        <th>Medicine</th>
        <th>Total</th>
        <th>Status</th>
      </tr>

    </thead>

    <tbody id="recentOrders"></tbody>

  </table>

</div>

<script>

const token =
  localStorage.getItem("token");

if(!token){
  window.location.href =
    "login.html";
}

async function loadAnalytics(){

  const res =
    await fetch(
      "https://cloudship-app-584731333956.asia-south1.run.app/orders"
    );

  const result = await res.json();

  const orders = result.data;

  // ================= COUNTS =================

  const totalOrders =
    orders.length;

  const delivered =
    orders.filter(
      o => o.status === "Delivered"
    ).length;

  const pending =
    orders.filter(
      o => o.status === "Pending"
    ).length;

  const revenue =
    orders.reduce(
      (sum,o)=>
      sum + (o.total || 0),
      0
    );

  document.getElementById(
    "totalOrders"
  ).innerText = totalOrders;

  document.getElementById(
    "delivered"
  ).innerText = delivered;

  document.getElementById(
    "pending"
  ).innerText = pending;

  document.getElementById(
    "revenue"
  ).innerText =
    "₹" + revenue;

  // ================= REVENUE CHART =================

  const revenueLabels =
    orders.map(
      (o,i)=>"Order "+(i+1)
    );

  const revenueData =
    orders.map(
      o=>o.total || 0
    );

  new Chart(
    document.getElementById(
      "revenueChart"
    ),
    {
      type:"line",

      data:{
        labels:revenueLabels,

        datasets:[{
          label:"Revenue",
          data:revenueData,
          tension:0.4
        }]
      }
    }
  );

  // ================= STATUS PIE =================

  new Chart(
    document.getElementById(
      "statusChart"
    ),
    {
      type:"doughnut",

      data:{
        labels:[
          "Delivered",
          "Pending"
        ],

        datasets:[{
          data:[
            delivered,
            pending
          ]
        }]
      }
    }
  );

  // ================= RECENT ORDERS =================

  document.getElementById(
    "recentOrders"
  ).innerHTML = "";

  orders.slice(0,5).forEach(order=>{

    document.getElementById(
      "recentOrders"
    ).innerHTML += `

      <tr>

        <td>${order.name}</td>

        <td>${order.medicine}</td>

        <td>₹${order.total}</td>

        <td class="${
          order.status === 'Delivered'
          ? 'delivered'
          : 'pending'
        }">

          ${order.status}

        </td>

      </tr>
    `;
  });

}

// ================= LOGOUT =================

function logout(){

  localStorage.removeItem(
    "token"
  );

  window.location.href =
    "login.html";
}

loadAnalytics();

</script>

</body>
</html>
