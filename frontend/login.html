<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PulseRx Login</title>

  <link
    rel="stylesheet"
    href="css/login.css"
  />

</head>

<body>

  <!-- ANIMATED BG -->

  <div class="bg-animation"></div>

  <div class="container">

    <!-- LEFT -->

    <div class="left-panel">

      <img
        src="images/pulserx-logo.png"
        class="logo"
      />

      <h1>PulseRx 💊</h1>

      <p class="slogan">

        स्वस्थः जनः समृद्धः राष्ट्रः।<br>

        आरोग्यसेवा सर्वेषां अधिकारः।<br>

        वयं तत् साधयामः॥

      </p>

    </div>

    <!-- RIGHT -->

    <div class="right-panel">

      <div class="login-box">

        <h2>Welcome Back</h2>

        <p class="sub-text">
          Login to continue
        </p>

        <!-- TABS -->

        <div class="tabs">

          <button
            id="passwordTab"
            class="active"
          >
            Password Login
          </button>

          <button id="otpTab">
            OTP Login
          </button>

        </div>

        <!-- PASSWORD -->

        <form id="passwordForm">

          <input
            type="text"
            id="mobile"
            placeholder="Enter Mobile Number"
          />

          <input
            type="password"
            id="password"
            placeholder="Enter Password"
          />

          <button type="submit">
            Login
          </button>

        </form>

        <!-- OTP -->

        <form
          id="otpForm"
          class="hidden"
        >

          <input
            type="text"
            id="otpMobile"
            placeholder="Enter Mobile Number"
          />

          <button
            type="button"
            id="sendOtpBtn"
          >
            Send OTP
          </button>

          <input
            type="text"
            id="otp"
            placeholder="Enter OTP"
          />

          <button type="submit">
            Verify OTP
          </button>

        </form>

        <p class="signup-link">

          New User?

          <a href="signup.html">

            Create Account

          </a>

        </p>

      </div>

    </div>

  </div>
  <script
  type="module"
  src="js/firebase-config.js">
  </script>
  <script src="js/login.js"></script>

</body>

</html>
