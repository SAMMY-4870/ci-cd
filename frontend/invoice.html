<!DOCTYPE html>
<html>
<head>
  <title>Invoice</title>

  <style>
    body{
      font-family:Arial;
      background:#f5f5f5;
      padding:30px;
    }

    .invoice{
      background:white;
      max-width:800px;
      margin:auto;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .top{
      display:flex;
      justify-content:space-between;
      margin-bottom:30px;
    }

    h1{
      color:#007bff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    table th, table td{
      border:1px solid #ddd;
      padding:12px;
      text-align:left;
    }

    .total{
      text-align:right;
      margin-top:20px;
      font-size:22px;
      font-weight:bold;
    }

    button{
      margin-top:20px;
      padding:12px 20px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="invoice">

  <div class="top">
    <div>
      <h1>CloudShip 🚀</h1>
      <p>Medical Delivery Service</p>
    </div>

    <div>
      <h3>Invoice</h3>
      <p id="date"></p>
    </div>
  </div>

  <hr>

  <h3>Customer Details</h3>

  <p><b>Name:</b> <span id="name"></span></p>
  <p><b>Mobile:</b> <span id="mobile"></span></p>
  <p><b>Address:</b> <span id="address"></span></p>

  <table>
    <thead>
      <tr>
        <th>Medicine</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Tax</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td id="medicine"></td>
        <td id="quantity"></td>
        <td id="price"></td>
        <td id="tax"></td>
        <td id="grand"></td>
      </tr>
    </tbody>
  </table>

  <div class="total">
    Grand Total: ₹<span id="total"></span>
  </div>

  <button onclick="window.print()">
    Print Invoice
  </button>

</div>

<script>

const order = JSON.parse(localStorage.getItem("invoice"));

document.getElementById("name").innerText = order.name;
document.getElementById("mobile").innerText = order.mobile;
document.getElementById("address").innerText = order.address;

document.getElementById("medicine").innerText = order.medicine;
document.getElementById("quantity").innerText = order.quantity;

document.getElementById("price").innerText = "₹" + order.price;

document.getElementById("tax").innerText =
  "₹" + order.tax.toFixed(2);

document.getElementById("grand").innerText =
  "₹" + order.total.toFixed(2);

document.getElementById("total").innerText =
  order.total.toFixed(2);

document.getElementById("date").innerText =
  new Date().toLocaleString();

</script>

</body>
</html>
