name: CI/CD Pipeline

on:

  push:

    branches:

      - main

jobs:

  # =====================================
  # BUILD STAGE
  # =====================================

  build:

    runs-on: ubuntu-latest

    steps:

      # CHECKOUT

      - name: Checkout code

        uses: actions/checkout@v4

      # NODE

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: "18"

      # INSTALL

      - name: Install dependencies

        run: |

          cd backend
          npm install

      # SERVER TEST

      - name: Start server test

        env:

          PORT: 8080

          NODE_ENV: production

        run: |

          cd backend
          node server.js &
          sleep 10

      # SUCCESS

      - name: Build Success

        run: |

          echo "✅ Build completed"

  # =====================================
  # TEST STAGE
  # =====================================

  test:

    runs-on: ubuntu-latest

    needs: build

    steps:

      # CHECKOUT

      - name: Checkout code

        uses: actions/checkout@v4

      # TEST

      - name: Dummy Test

        run: |

          echo "✅ Tests passed"

  # =====================================
  # DEPLOY STAGE
  # =====================================

  deploy:

    runs-on: ubuntu-latest

    needs: test

    steps:

      # CHECKOUT

      - name: Checkout code

        uses: actions/checkout@v4

      # GCP AUTH

      - name: Authenticate to GCP

        uses: google-github-actions/auth@v2

        with:

          credentials_json:

            '${{ secrets.GCP_SA_KEY }}'

      # GCLOUD

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v2

      # PROJECT

      - name: Set GCP Project

        run: |

          gcloud config set project \
          ${{ secrets.GCP_PROJECT_ID }}

      # BUILD IMAGE

      - name: Build Docker Image

        run: |

          gcloud builds submit \
          --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/cloudship-app \
          --quiet

      # DEPLOY CLOUD RUN

      - name: Deploy to Cloud Run

        run: |

          gcloud run deploy cloudship-app \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cloudship-app \
          --region asia-south1 \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --memory 512Mi \
          --timeout 300 \
          --set-env-vars NODE_ENV=production

      # SUCCESS

      - name: Deployment Success

        run: |

          echo "🚀 Cloud Run Deployment Success"